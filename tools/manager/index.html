<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的博客 · 写作</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#26312d;font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #d7dfda;border-radius:8px;padding:8px 14px;background:white;color:#26312d}button:hover{background:#eff4f0}button:disabled{opacity:.5;cursor:wait}a{color:#367957}header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:white;border-bottom:1px solid #e1e6e0}header strong{font-size:21px}header span{color:#79847d;font-size:13px;margin-left:16px}.shell{max-width:1400px;margin:auto;display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 76px)}aside{padding:28px 18px;border-right:1px solid #e1e6e0}aside button.new{width:100%;background:#2f6d50;color:white;margin-bottom:22px}.entry{display:block;width:100%;text-align:left;margin-bottom:8px;border:0;background:transparent;padding:12px}.entry.active{background:#e1ece3}.entry small{display:block;color:#778079}main{padding:30px 42px}input,textarea{width:100%;background:white;border:1px solid #dce3dd;border-radius:7px;padding:9px 12px}#title{font-size:29px;font-weight:600;border:0;background:transparent;padding-left:0;outline:none}.meta{display:grid;grid-template-columns:170px 1fr 1fr;gap:16px;margin:16px 0 24px}label{font-size:13px;color:#78827b}.toolbar{display:flex;gap:7px;flex-wrap:wrap;border:1px solid #dce3dd;border-radius:9px 9px 0 0;padding:10px;background:#fafcf9}.editor{min-height:440px;background:white;border:1px solid #dce3dd;border-top:0;padding:28px;border-radius:0 0 9px 9px;outline:none;overflow-wrap:anywhere;font-size:17px}.editor:empty:before{content:'从这里开始写……';color:#a0aaa3}.editor img{max-width:100%;height:auto}.editor pre{white-space:pre-wrap;background:#eef2ef;padding:16px;border-radius:6px}.editor blockquote{border-left:3px solid #7b9c84;padding-left:15px;color:#6f7f73}#source{min-height:460px;font:14px/1.8 Consolas,monospace}.bottom{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:20px}.primary{background:#2f6d50;color:white;border-color:#2f6d50}.primary:hover{background:#25563f}.hint{color:#7a857d;font-size:13px}#status{margin-top:16px;font-size:14px;color:#36634b}.error{color:#b13f39!important}.empty{padding-top:100px;text-align:center;color:#748078}.empty h1{color:#26312d;font-size:30px}.hidden{display:none!important}@media(max-width:800px){header{padding:0 15px}header span{display:none}.shell{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #ddd;padding:14px}#entries{display:flex;overflow:auto}.entry{min-width:180px}.meta{grid-template-columns:1fr}main{padding:20px}.editor{padding:18px}.bottom{align-items:flex-start;flex-wrap:wrap}}
</style></head><body>
<header><div><strong>我的博客</strong><span>写下来，慢慢积累。</span></div><a href="https://sleepy-m.github.io/" target="_blank" rel="noopener">查看博客 ↗</a></header>
<div class="shell"><aside><button class="new" id="new">＋ 写新文章</button><div id="entries"></div><p class="hint">草稿保存在这台电脑。<br>点击发布才会更新网站。</p></aside>
<main><div id="empty" class="empty"><h1>今天想记录什么？</h1><p>点击左边的文章修改，或开始一篇新文章。</p></div><section id="form" class="hidden">
<input id="title" aria-label="文章标题" placeholder="文章标题"><div class="meta"><label>日期<input id="date" type="date"></label><label>分类<input id="categories" placeholder="例如：学习笔记"></label><label>标签<input id="tags" placeholder="多个标签用逗号分隔"></label></div>
<div class="toolbar"><button data-command="bold"><b>加粗</b></button><button data-block="h2">标题</button><button data-command="insertUnorderedList">列表</button><button data-block="blockquote">引用</button><button id="code">代码</button><button id="link">链接</button><button id="image">插入图片</button><button id="mode">查看原文</button><input id="upload" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden></div>
<div id="editor" class="editor" contenteditable="true" role="textbox" aria-label="文章正文" aria-multiline="true"></div><textarea id="source" class="hidden" aria-label="Markdown 原文"></textarea>
<div class="bottom"><span id="saved" class="hint">修改会自动保存为本机草稿</span><div><button id="save">保存草稿</button> <button id="publish" class="primary">发布到博客</button></div></div>
</section><div id="status" role="status" aria-live="polite"></div></main></div>
<script src="/marked.js"></script><script src="/purify.js"></script><script src="/turndown.js"></script><script src="/app.js"></script></body></html>
