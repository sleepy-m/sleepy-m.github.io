title: 我的个人博客
subtitle: 记录、学习与分享
description: 保存值得留下的经验与想法。
author: sleepy-m
language: zh-CN
timezone: Asia/Shanghai
url: https://sleepy-m.github.io
root: /
permalink: posts/:title/
pretty_urls:
  trailing_index: false
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
new_post_name: :title.md
default_layout: post
render_drafts: false
post_asset_folder: true
future: false
date_format: YYYY-MM-DD
updated_option: date
per_page: 10
theme: fluid
search:
  path: search.xml
  field: post
  content: true
markdown:
  preset: default
  render:
    html: true
    breaks: false
    linkify: true
    typographer: false
  plugins:
    - name: '@traptitech/markdown-it-katex'
      options:
        throwOnError: false
        trust: false
  images:
    prepend_root: true
    post_asset: true
highlight:
  enable: true
  line_number: false
deploy: {}
