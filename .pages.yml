media:
  input: source/uploads
  output: /uploads
  categories: [image]
  rename: random
settings:
  content:
    merge: true
content:
  - name: posts
    label: 写文章
    type: collection
    path: source/_posts
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{year}{month}{day}-{hour}{minute}{second}-{primary}.md"
      field: false
    operations:
      rename: false
    view:
      primary: title
      fields: [title, published, date]
      sort: date
      order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: published
        label: 保存后发布到博客
        type: boolean
        default: true
        description: 已打开时，点右上角保存按钮就会发布；只想存草稿时才关闭。
      - name: body
        label: 正文
        type: rich-text
        options:
          format: markdown
          switcher: true
      - name: date
        label: 日期（自动填写）
        type: date
        required: true
        options:
          time: false
          format: yyyy-MM-dd
      - name: categories
        label: 分类
        type: string
        list: true
      - name: tags
        label: 标签
        type: string
        list: true
  - name: about
    label: 关于我
    type: file
    path: source/about/index.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: 页面标题
        type: string
        required: true
      - name: body
        label: 个人介绍
        type: rich-text
        options:
          format: markdown
  - name: site
    label: 博客名称与简介
    type: file
    path: _config.yml
    format: yaml
    fields:
      - name: title
        label: 博客名称
        type: string
        required: true
      - name: subtitle
        label: 一句话介绍
        type: string
      - name: description
        label: 简介
        type: text
      - name: author
        label: 作者名称
        type: string
